[mod-setting-name]
crafting-multiplier=Crafting Multiplier
result-multiplier=Result Multiplier
science-multiplier=Science Multiplier
energy-multiplier=Energy Multiplier

[mod-setting-description]
crafting-multiplier=Multiplies the resource requirements for all recipes by an integer value from 1 to 100. For example, a multiplier of 5 requires 5 times more resources than vanilla.
result-multiplier=(In development) Multiplies the results (products) of all recipes by an integer value from 1 to 100. For example, a multiplier of 3 produces 3 times more products than vanilla.
science-multiplier=Multiplies the science pack requirements for all technologies by an integer value from 1 to 100. For example, a multiplier of 10 requires 10 times more science packs than vanilla.
energy-multiplier=Multiplies the energy consumption of all machines, including active usage, idle drain, and pollution emissions.