[mod-setting-name]
crafting-multiplier=Множитель крафта
result-multiplier=Множитель результата
science-multiplier=Научный мультипликатор
energy-multiplier=Энергетический множитель

[mod-setting-description]
crafting-multiplier=Умножает требования к ресурсам для всех рецептов на целое значение от 1 до 100. Например, для умножения на 5 требуется в 5 раз больше ресурсов, чем для ванилы.
result-multiplier=(В разработке) Умножает результаты (продукты) всех рецептов на целое значение от 1 до 100. Например, при множителе 3 получается в 3 раза больше продуктов, чем при использовании ванили.
science-multiplier=Умножает требования к научному набору для всех технологий на целое значение от 1 до 100. Например, для умножения на 10 требуется в 10 раз больше научных наборов, чем для vanilla.
energy-multiplier= Умножается потребление энергии всех машин, включая активное использование, простоя и выбросы загрязнения.